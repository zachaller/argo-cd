apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: argocd-aggregated-apiserver
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/component: aggregated-apiserver
  name: argocd-aggregated-apiserver
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-aggregated-apiserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-aggregated-apiserver
    spec:
      serviceAccountName: argocd-aggregated-apiserver
      containers:
        - name: argocd-aggregated-apiserver
          image: quay.io/argoproj/argocd:latest
          imagePullPolicy: Always
          args:
            - /usr/local/bin/argocd-aggregated-apiserver
            - --secure-port=8443
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: auth
                  name: argocd-redis
            - name: ARGOCD_AGGREGATED_APISERVER_LOGFORMAT
              valueFrom:
                configMapKeyRef:
                  name: argocd-cmd-params-cm
                  key: aggregatedapiserver.log.format
                  optional: true
            - name: ARGOCD_AGGREGATED_APISERVER_LOGLEVEL
              valueFrom:
                configMapKeyRef:
                  name: argocd-cmd-params-cm
                  key: aggregatedapiserver.log.level
                  optional: true
            - name: ARGOCD_AGGREGATED_APISERVER_RBAC_SUBJECT_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: argocd-cmd-params-cm
                  key: aggregatedapiserver.rbac.subject.prefix
                  optional: true
            - name: ARGOCD_AGGREGATED_APISERVER_WATCH_BOOKMARK_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: argocd-cmd-params-cm
                  key: aggregatedapiserver.watch.bookmark.interval
                  optional: true
            - name: ARGOCD_AGGREGATED_APISERVER_WATCH_BUFFER_SIZE
              valueFrom:
                configMapKeyRef:
                  name: argocd-cmd-params-cm
                  key: aggregatedapiserver.watch.buffer.size
                  optional: true
            - name: ARGOCD_AGGREGATED_APISERVER_WATCH_RESYNC_PERIOD
              valueFrom:
                configMapKeyRef:
                  name: argocd-cmd-params-cm
                  key: aggregatedapiserver.watch.resync.period
                  optional: true
            - name: ARGOCD_APPLICATION_NAMESPACES
              valueFrom:
                configMapKeyRef:
                  name: argocd-cmd-params-cm
                  key: application.namespaces
                  optional: true
            - name: ARGOCD_APP_STATE_CACHE_EXPIRATION
              valueFrom:
                configMapKeyRef:
                  name: argocd-cmd-params-cm
                  key: server.app.state.cache.expiration
                  optional: true
            - name: REDIS_SERVER
              valueFrom:
                configMapKeyRef:
                  name: argocd-cmd-params-cm
                  key: redis.server
                  optional: true
            - name: REDIS_SENTINEL_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: argocd-cmd-params-cm
                  key: redis.sentinel.hosts
                  optional: true
            - name: REDIS_SENTINEL_MASTER
              valueFrom:
                configMapKeyRef:
                  name: argocd-cmd-params-cm
                  key: redis.sentinel.master
                  optional: true
            - name: REDIS_COMPRESSION
              valueFrom:
                configMapKeyRef:
                  name: argocd-cmd-params-cm
                  key: redis.compression
                  optional: true
            - name: REDISDB
              valueFrom:
                configMapKeyRef:
                  name: argocd-cmd-params-cm
                  key: redis.db
                  optional: true
            - name: ARGOCD_REDIS_KEY_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: argocd-cmd-params-cm
                  key: redis.key.prefix
                  optional: true
            - name: ARGOCD_DEFAULT_CACHE_EXPIRATION
              valueFrom:
                configMapKeyRef:
                  name: argocd-cmd-params-cm
                  key: server.default.cache.expiration
                  optional: true
          ports:
            - containerPort: 8443
              name: https
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: argocd-aggregated-apiserver
                topologyKey: kubernetes.io/hostname
      nodeSelector:
        kubernetes.io/os: linux
