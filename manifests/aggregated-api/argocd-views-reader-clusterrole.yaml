# Grants read access to the views.argoproj.io resources. Bind it with a RoleBinding (or ClusterRoleBinding) to the
# users, groups or ServiceAccounts which may read them. Access is additionally restricted by the Argo CD RBAC policy.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: argocd-views-reader
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/component: aggregated-apiserver
  name: argocd-views-reader
rules:
- apiGroups:
  - views.argoproj.io
  resources:
  - applicationtrees
  - applicationdiffs
  verbs:
  - get
  - list
  - watch
